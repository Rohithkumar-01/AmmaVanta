<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AmmaVanta | Admin Login</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Poppins', sans-serif;
}
.glass {
  backdrop-filter: blur(15px);
  background: rgba(255,255,255,0.75);
}
</style>
</head>

<body class="relative min-h-screen flex items-center justify-center overflow-hidden bg-gradient-to-br from-green-50 via-emerald-100 to-green-200">

<!-- Floating Background Blobs -->
<div class="absolute -top-32 -left-32 w-96 h-96 bg-green-300 rounded-full blur-3xl opacity-40 animate-pulse"></div>
<div class="absolute bottom-0 right-0 w-96 h-96 bg-emerald-400 rounded-full blur-3xl opacity-40 animate-pulse"></div>

<!-- LOGIN CARD -->
<div class="glass w-full max-w-md p-10 rounded-3xl shadow-2xl relative z-10">

  <!-- Logo -->
  <div class="text-center mb-8">
    <h1 class="text-4xl font-extrabold text-green-700">🌿 AmmaVanta</h1>
    <p class="text-gray-600 mt-2 text-sm">Admin Control Panel</p>
  </div>

  <form id="loginForm" class="space-y-6">

    <!-- Username -->
    <div>
      <label class="block text-sm font-semibold text-gray-700 mb-1">
        Username
      </label>
      <input type="text" id="username"
             class="w-full px-4 py-3 border rounded-xl focus:ring-2 focus:ring-green-500 focus:outline-none transition"
             placeholder="Enter admin username"
             required>
    </div>

    <!-- Password -->
    <div>
      <label class="block text-sm font-semibold text-gray-700 mb-1">
        Password
      </label>
      <input type="password" id="password"
             class="w-full px-4 py-3 border rounded-xl focus:ring-2 focus:ring-green-500 focus:outline-none transition"
             placeholder="Enter password"
             required>
    </div>

    <!-- Button -->
    <button type="submit"
            class="w-full bg-gradient-to-r from-green-600 to-emerald-600 text-white py-3 rounded-xl font-bold hover:scale-105 transition duration-300 shadow-lg">
      Login
    </button>

    <!-- Error Message -->
    <p id="errorMsg" class="text-red-500 text-sm text-center"></p>

  </form>

  <!-- Footer -->
  <div class="text-center mt-8 text-xs text-gray-500">
    © 2026 AmmaVanta • Admin Access
  </div>

</div>

<script>
const loginForm = document.getElementById("loginForm");
const errorMsg = document.getElementById("errorMsg");

loginForm.onsubmit = function (e) {
  e.preventDefault();

  const username = document.getElementById("username").value;
  const password = document.getElementById("password").value;

  if (username === "admin" && password === "admin123") {
    localStorage.setItem("isAdminLoggedIn", "true");
    window.location.href = "admin.html";
  } else {
    errorMsg.textContent = "❌ Invalid username or password";
  }
};
</script>

</body>
</html>
