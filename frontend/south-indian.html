<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AmmaVanta | South Indian</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
body { font-family: 'Poppins', sans-serif; }
.glass {
  backdrop-filter: blur(12px);
  background: rgba(255,255,255,0.75);
}
</style>
</head>

<body class="bg-gradient-to-br from-green-50 via-emerald-100 to-green-200 min-h-screen relative overflow-x-hidden">

<!-- Decorative Blur -->
<div class="absolute -top-20 -left-20 w-96 h-96 bg-green-200 rounded-full blur-3xl opacity-40"></div>
<div class="absolute bottom-0 right-0 w-96 h-96 bg-emerald-300 rounded-full blur-3xl opacity-40"></div>

<!-- HEADER -->
<header class="glass sticky top-0 z-50 shadow-md">
  <div class="max-w-7xl mx-auto flex justify-between items-center p-5">
    <h1 class="text-3xl font-extrabold text-green-700">🥞 South Indian Menu</h1>
    <a href="menu.html" class="bg-green-600 text-white px-4 py-2 rounded-full hover:scale-105 transition">
      ← Back
    </a>
  </div>
</header>

<!-- SECTION NAV -->
<div class="sticky top-20 bg-green-700 text-white flex justify-center gap-10 py-3 shadow text-sm font-semibold z-40">
  <button onclick="scrollToSection('tiffins')" class="hover:text-yellow-300">🥞 Tiffins</button>
  <button onclick="scrollToSection('meals')" class="hover:text-yellow-300">🍽 Meals</button>
  <button onclick="scrollToSection('rice')" class="hover:text-yellow-300">🍚 Rice</button>
</div>

<section class="max-w-7xl mx-auto px-6 py-16 space-y-24">

<div id="tiffins">
<h2 class="text-2xl font-bold text-gray-800 mb-8">🥞 Breakfast / Tiffins</h2>
<div id="tiffinsList" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-10"></div>
</div>

<div id="meals">
<h2 class="text-2xl font-bold text-gray-800 mb-8">🍽 Veg Meals & Thali</h2>
<div id="mealsList" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-10"></div>
</div>

<div id="rice">
<h2 class="text-2xl font-bold text-gray-800 mb-8">🍚 Rice Items</h2>
<div id="riceList" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-10"></div>
</div>

</section>

<script>
const BACKEND_URL = "https://YOUR-BACKEND-NAME.onrender.com";
const fallbackImage = "https://via.placeholder.com/400x300?text=No+Image";

function scrollToSection(id){
  document.getElementById(id).scrollIntoView({behavior:"smooth"});
}

function createCard(item){
  return `
  <div class="bg-white rounded-3xl shadow-lg overflow-hidden hover:shadow-2xl transition transform hover:-translate-y-3 duration-300">

    <div class="h-56 bg-gray-50 flex items-center justify-center overflow-hidden">
      <img src="${item.image || fallbackImage}"
           onerror="this.src='${fallbackImage}'"
           class="h-full object-contain transition duration-300 hover:scale-110">
    </div>

    <div class="p-6 text-center">
      <h3 class="text-lg font-bold text-green-700">${item.name} 🌱</h3>
      <p class="text-gray-600 mt-2 text-lg font-semibold">₹${item.price}</p>
      <p class="text-yellow-500 mt-1">${item.rating || ""}</p>
      <p class="text-xs text-gray-500 mt-2">Ordered ${item.orders} times</p>
    </div>

  </div>
  `;
}

fetch(`${BACKEND_URL}/menu`)
.then(res=>res.json())
.then(items=>{
  const southItems = items.filter(i=>i.category==="south");

  southItems.forEach(item=>{
    if(item.subCategory==="tiffins") tiffinsList.innerHTML += createCard(item);
    if(item.subCategory==="meals") mealsList.innerHTML += createCard(item);
    if(item.subCategory==="rice") riceList.innerHTML += createCard(item);
  });
});
</script>

</body>
</html>
