<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AmmaVanta | Admin Panel</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
body { font-family: 'Poppins', sans-serif; }
.glass {
  backdrop-filter: blur(18px);
  background: rgba(255,255,255,0.7);
}
</style>
</head>

<body class="bg-gradient-to-br from-green-50 via-emerald-100 to-green-200 min-h-screen relative overflow-x-hidden">

<!-- Background Decoration -->
<div class="absolute -top-32 -left-32 w-96 h-96 bg-green-200 rounded-full blur-3xl opacity-40"></div>
<div class="absolute bottom-0 right-0 w-96 h-96 bg-emerald-300 rounded-full blur-3xl opacity-40"></div>

<script>
if (localStorage.getItem("isAdminLoggedIn") !== "true") {
  window.location.href = "login.html";
}
function logout(){
  localStorage.removeItem("isAdminLoggedIn");
  window.location.href = "login.html";
}
</script>

<!-- NAVBAR -->
<header class="glass sticky top-0 z-50 shadow-md">
  <div class="max-w-7xl mx-auto flex justify-between items-center p-5">
    <h1 class="text-2xl font-extrabold text-green-700">🌿 AmmaVanta Admin</h1>
    <div class="space-x-4">
      <a href="index.html" class="hover:text-green-700 font-semibold">Home</a>
      <button onclick="logout()" class="bg-red-500 text-white px-4 py-2 rounded-full hover:scale-105 transition">
        Logout
      </button>
    </div>
  </div>
</header>

<!-- TITLE -->
<section class="text-center py-12">
  <h2 class="text-4xl font-extrabold text-gray-800">Menu Management</h2>
  <p class="text-gray-600 mt-2">Add, view and manage menu items</p>
</section>

<!-- ADD ITEM FORM -->
<section class="max-w-5xl mx-auto glass rounded-3xl shadow-xl p-10">

<h3 class="text-2xl font-bold mb-8">➕ Add New Item</h3>

<form id="adminForm" class="grid md:grid-cols-2 gap-8">

<input id="itemName" placeholder="Item Name" required class="border rounded-xl px-4 py-3 focus:ring-2 focus:ring-green-500">

<input id="itemPrice" type="number" placeholder="Price (₹)" required class="border rounded-xl px-4 py-3 focus:ring-2 focus:ring-green-500">

<select id="itemCategory" class="border rounded-xl px-4 py-3">
  <option value="">Select Category</option>
  <option value="south">South Indian</option>
  <option value="north">North Indian</option>
  <option value="starters">Starters</option>
  <option value="desserts">Desserts</option>
</select>

<select id="itemSubCategory" class="border rounded-xl px-4 py-3">
  <option value="">Sub Category</option>
  <option value="tiffins">Tiffins</option>
  <option value="meals">Meals</option>
  <option value="rice">Rice</option>
</select>

<select id="itemRating" class="border rounded-xl px-4 py-3">
  <option>⭐⭐⭐⭐⭐</option>
  <option>⭐⭐⭐⭐☆</option>
  <option>⭐⭐⭐☆☆</option>
</select>

<input id="itemOrders" type="number" value="0" class="border rounded-xl px-4 py-3">

<input id="itemImage" type="file" accept="image/*" class="md:col-span-2 border rounded-xl px-4 py-3">

<button class="md:col-span-2 bg-gradient-to-r from-green-600 to-emerald-600 text-white py-4 rounded-xl font-bold hover:scale-105 transition duration-300">
  Add Item
</button>

</form>
</section>

<!-- EXISTING ITEMS -->
<section class="max-w-6xl mx-auto mt-16 glass rounded-3xl shadow-xl p-10">

<h3 class="text-2xl font-bold mb-8">📋 Existing Items</h3>

<div id="adminItemList" class="grid md:grid-cols-2 lg:grid-cols-3 gap-8"></div>

</section>

<script>

const BACKEND_URL = "https://YOUR-RENDER-BACKEND.onrender.com"; 
// 🔥 Replace this with your actual Render backend URL

const adminForm = document.getElementById("adminForm");
const adminItemList = document.getElementById("adminItemList");

adminForm.onsubmit = async function(e){
  e.preventDefault();

  const formData = new FormData();
  formData.append("name", itemName.value);
  formData.append("price", itemPrice.value);
  formData.append("category", itemCategory.value);
  formData.append("subCategory", itemSubCategory.value);
  formData.append("rating", itemRating.value);
  formData.append("orders", itemOrders.value);

  if (itemImage.files.length > 0) {
    formData.append("image", itemImage.files[0]);
  }

  try {
    const res = await fetch(`${BACKEND_URL}/menu`, {
      method: "POST",
      body: formData
    });

    if (!res.ok) throw new Error("Failed to add item");

    adminForm.reset();
    loadItems();
    alert("✅ Item Added Successfully");

  } catch (err) {
    alert("❌ Error adding item");
    console.error(err);
  }
};

async function loadItems(){
  adminItemList.innerHTML = "";

  try {
    const res = await fetch(`${BACKEND_URL}/menu`);
    const items = await res.json();

    items.forEach(item=>{
      adminItemList.innerHTML += `
      <div class="bg-white rounded-3xl shadow-lg overflow-hidden hover:shadow-2xl transition">

        <div class="h-40 bg-gray-50 flex items-center justify-center">
          <img src="${item.image || 'https://via.placeholder.com/200'}"
               onerror="this.src='https://via.placeholder.com/200'"
               class="h-full object-contain"> 
        </div>

        <div class="p-5">
          <h3 class="font-bold text-green-700">${item.name}</h3>
          <p class="text-sm text-gray-600 mt-1">₹${item.price}</p>
          <p class="text-xs text-gray-500 mt-1">
            ${item.category} ${item.subCategory ? "• " + item.subCategory : ""}
          </p>

          <button onclick="deleteItem('${item._id}')"
                  class="mt-3 text-red-600 hover:underline text-sm">
            Delete
          </button>
        </div>

      </div>
      `;
    });

  } catch (err) {
    console.error("Error loading items:", err);
  }
}

async function deleteItem(id){
  try {
    await fetch(`${BACKEND_URL}/menu/${id}`, { method: "DELETE" });
    loadItems();
  } catch (err) {
    console.error("Delete failed:", err);
  }
}

loadItems();

</script>

</body>
</html>
